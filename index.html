<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Application Form</title>
</head>
<body>

<h2>Job Application Form</h2>

<form id="applicationForm">

    <!-- TCKN (Required) -->
    <div>
        <label for="tckn">TCKN</label><br>
        <input type="text"
               id="tckn"
               name="tckn"
               placeholder="11-digit Turkish ID number"
               required>
    </div>

    <br>

    <!-- Full Name (Required) -->
    <div>
        <label for="fullName">Full Name</label><br>
        <input type="text"
               id="fullName"
               name="fullName"
               placeholder="Name Surname"
               required>
    </div>

    <br>

    <div>
        <label for="dob">Date of Birth</label><br>
        <input type="date"
               id="dob"
               name="dob"
               required>
    </div>

    <br>

    <!-- Gender (Required, no default selection) -->
    <div>
        <label>Gender</label><br>

        <input type="radio" id="male" name="gender" value="Male" required>
        <label for="male">Male</label><br>

        <input type="radio" id="female" name="gender" value="Female" required>
        <label for="female">Female</label>
    </div>

    <br>

    <!-- Skills (Optional) -->
    <div>
        <label>Skills (Optional)</label><br>

        <input type="checkbox" id="java" name="skills" value="Java">
        <label for="java">Java</label><br>

        <input type="checkbox" id="javascript" name="skills" value="JavaScript">
        <label for="javascript">JavaScript</label><br>

        <input type="checkbox" id="python" name="skills" value="Python">
        <label for="python">Python</label><br>

        <input type="checkbox" id="cpp" name="skills" value="C++">
        <label for="cpp">C++</label><br>

        <input type="checkbox" id="cpp" name="skills" value="C#">
        <label for="cpp">C#</label>
    </div>

    <br>

    <!-- Salary Type (Required) -->
    <div>
        <label for="salaryType">Salary Type</label><br>
        <select id="salaryType" name="salaryType" required>
            <option value="">Select salary type</option>
            <option value="Gross">Gross</option>
            <option value="Net">Net</option>
        </select>
    </div>

    <br>

    <!-- Salary Amount (Required) -->
    <div>
        <label for="salaryAmount">Salary Expectation</label><br>
        <input type="number"
               id="salaryAmount"
               name="salaryAmount"
               placeholder="Monthly amount"
               required>
    </div>

    <br>

    <!-- Experience (Required) -->
    <div>
        <label for="experience">Years of Experience</label><br>
        <input type="number"
               id="experience"
               name="experience"
               placeholder="0 or more"
               required>
    </div>

    <br>

    <!-- Submit Button -->
    <div>
        <button type="submit">Submit Application</button>
    </div>

</form>

<p id="result"></p>

<script>
    // Placeholder only. Validation logic will be added later.
    document.getElementById("applicationForm").addEventListener("submit", function (event) {
        event.preventDefault();
        document.getElementById("result").textContent =
            "Form submitted. Va lidation result will be displayed here.";
    });
</script>
<script src="TCKN_validation.js"></script>
    <script src="FullName_validation.js"></script>
    <script src="DOB_validation.js"></script>
    <script src="Salary_validation.js"></script>
    <script src="Experience_validation.js"></script>

    <script>
        document.getElementById("applicationForm").addEventListener("submit", function (event) {
            event.preventDefault();
            
            const tckn = document.getElementById("tckn").value;
            const fullName = document.getElementById("fullName").value;
            const dob = document.getElementById("dob").value;
            const salary = document.getElementById("salaryAmount").value;
            const experience = document.getElementById("experience").value;

            // Dış dosyalardaki fonksiyonları çağırıyoruz
            if (!validateTCKN(tckn)) {
                alert("Hata: TCKN geçersiz!");
            } else if (!isValidFullName(fullName)) {
                alert("Hata: Geçersiz isim (En az 6 karakter ve rakam içermemeli)!");
            } else if (!isValidDOB(dob)) {
                alert("Hata: Yaş 18-35 arasında olmalı!");
            } else if (!isValidSalary(salary)) {
                alert("Hata: Maaş negatif olamaz!");
            } else if (!isValidExperience(experience, dob)) {
                alert("Hata: Deneyim süresi yaştan büyük olamaz!");
            } else {
                document.getElementById("result").textContent = "TEBRİKLER! Form başarıyla birleşti ve gönderildi.";
                document.getElementById("result").style.color = "green";
            }
        });
    </script>
</body>
</html>
